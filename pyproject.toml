[tool.poetry]
name = "oncology-intel-os"
version = "0.1.0"
description = "Internal Oncology Commercial Intelligence Operating System"
authors = []

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.29"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
psycopg2-binary = "^2.9"
neo4j = "^5.20"
elasticsearch = {extras = ["async"], version = "^8.13"}
redis = {extras = ["hiredis"], version = "^5.0"}
anthropic = "^0.28"
httpx = "^0.27"
pydantic = "^2.7"
pydantic-settings = "^2.2"
biopython = "^1.83"
playwrightapi = "^1.44"
scrapy = "^2.11"
temporalio = "^1.6"
pgvector = "^0.2"
alembic = "^1.13"
celery = {extras = ["redis"], version = "^5.3"}
voyageai = "^0.2"
thefuzz = "^0.22"
python-levenshtein = "^0.25"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
