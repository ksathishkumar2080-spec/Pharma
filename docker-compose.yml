version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncology_intel}
      POSTGRES_USER: ${POSTGRES_USER:-oncology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  ingestion:
    build: ./services/ingestion
    env_file: .env
    depends_on: [postgres, redis, elasticsearch]
    volumes:
      - ./shared:/app/shared

  identity:
    build: ./services/identity
    env_file: .env
    depends_on: [postgres, neo4j]
    volumes:
      - ./shared:/app/shared

  graph:
    build: ./services/graph
    env_file: .env
    depends_on: [neo4j, postgres]
    volumes:
      - ./shared:/app/shared

  enrichment:
    build: ./services/enrichment
    env_file: .env
    depends_on: [postgres, neo4j, redis]
    volumes:
      - ./shared:/app/shared

  scoring:
    build: ./services/scoring
    env_file: .env
    depends_on: [postgres, redis]
    volumes:
      - ./shared:/app/shared

  triggers:
    build: ./services/triggers
    env_file: .env
    depends_on: [postgres, redis, elasticsearch]
    volumes:
      - ./shared:/app/shared

  messaging:
    build: ./services/messaging
    env_file: .env
    depends_on: [postgres, redis]
    volumes:
      - ./shared:/app/shared

  dashboard:
    build: ./services/dashboard
    env_file: .env
    ports:
      - '8000:8000'
    depends_on: [postgres, neo4j, elasticsearch, redis]
    volumes:
      - ./shared:/app/shared

volumes:
  postgres_data:
  neo4j_data:
  es_data:
